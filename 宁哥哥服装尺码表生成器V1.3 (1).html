<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服装尺码表生成器</title>
<style>
:root{--ink:#222;--muted:#777;--line:#e8e8e8;--panel:#fff;--bg:#f4f5f7;--accent:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif}
header{padding:22px 28px;background:#171717;color:#fff}
header h1{font-size:21px;margin:0 0 5px;font-weight:600;letter-spacing:1px}
header p{margin:0;color:#bbb;font-size:12px}
main{max-width:1440px;margin:22px auto;padding:0 20px;display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:20px}
.panel{background:#fff;border:1px solid #e9e9e9;border-radius:10px;padding:18px;box-shadow:0 2px 10px #00000008}
h2{font-size:15px;margin:0 0 13px}
label{display:block;font-size:12px;color:#555;margin:13px 0 6px}
textarea{width:100%;min-height:260px;resize:vertical;border:1px solid #ddd;border-radius:7px;padding:12px;font:13px/1.7 Consolas,monospace;outline:none}
textarea:focus,input:focus,select:focus{border-color:#777}
.hint{font-size:11px;color:#888;line-height:1.7;margin-top:7px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:1px solid #222;border-radius:6px;padding:9px 13px;background:#222;color:#fff;font-size:12px;cursor:pointer}
button.secondary{background:#fff;color:#333;border-color:#ddd}
button:hover{opacity:.82}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
input,select{width:100%;border:1px solid #ddd;border-radius:6px;padding:8px;font-size:12px;background:#fff}
.checkline{display:flex;align-items:center;gap:8px;font-size:12px;color:#555;margin-top:13px}
.checkline input{width:auto}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.preview-head h2{margin:0}
.stage{background:#fff;border:1px solid #eee;border-radius:8px;min-height:420px;padding:26px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}
#preview{width:100%;max-width:850px}
#preview table{width:100%;border-collapse:collapse;table-layout:fixed;font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;color:#222}
#preview th,#preview td{text-align:center;padding:0;font-weight:400;border:0;font-size:14px;white-space:nowrap}
#preview thead th{font-weight:600;background:#fff}
#preview tbody tr:nth-child(odd){background:#f3f3f3}
#preview tbody tr:nth-child(even){background:#fff}
#preview tbody td:first-child{font-weight:500}
#preview .empty{color:#999;text-align:center;padding:80px 15px;font-size:13px}
.status{font-size:11px;color:#777;margin-top:10px;min-height:16px}
@media(max-width:900px){main{grid-template-columns:1fr}.stage{padding:14px}}
</style>
</head>
<body>
<header><h1>服装尺码表生成器</h1><p>粘贴原始尺码表 · 自动转置 · 一键生成电商尺码图</p></header>
<main>
<section class="panel">
  <h2>01 / 输入原始尺码数据</h2>
  <textarea id="source" placeholder="从 Excel / WPS 复制整个尺码表，然后在这里 Ctrl + V&#10;&#10;支持制表符分隔的表格数据，例如：&#10;尺码部位&#9;测量方法&#9;S&#9;M&#9;L&#9;XL&#10;后中长&#9;&#9;68&#9;69.5&#9;71&#9;72.5"></textarea>
  <div class="hint">建议直接在 Excel / WPS 中选中整个表格复制，再粘贴到这里。程序会自动识别行列，并过滤空白列。合并单元格复制后可能需要检查一下数据。</div>
  <div class="actions">
    <button id="generate">生成尺码表</button>
    <button class="secondary" id="example">载入示例</button>
    <button class="secondary" id="clear">清空</button>
  </div>
  <div class="status" id="status">等待粘贴数据。</div>
  <hr style="border:0;border-top:1px solid #eee;margin:18px 0">
  <h2>02 / 样式设置</h2>
  <div class="controls">
    <div><label for="title">表格标题（可留空）</label><input id="title" value=""></div>
    <div><label for="font">字体</label>
      <select id="font">
        <option value="Arial, Microsoft YaHei, sans-serif">简洁无衬线</option>
        <option value="'PingFang SC', 'Microsoft YaHei', sans-serif" selected>苹方 PingFang SC</option>
        <option value="Georgia, SimSun, serif">衬线风格</option>
        <option value="Microsoft YaHei, sans-serif">微软雅黑</option>
      </select>
    </div>
    <div><label for="fontWeight">表格字体粗细</label>
      <select id="fontWeight">
        <option value="400">常规 400</option>
        <option value="500">中等 500</option>
        <option value="600">半粗 600</option>
        <option value="700">加粗 700</option>
      </select>
    </div>
    <div><label for="size">字号（px）</label><input id="size" type="number" min="9" max="30" value="21"></div>
    <div><label for="padding">表格行高（px）【支持20‑100】</label><input id="padding" type="number" min="20" max="100" value="75"></div>
    <div><label for="cellPadX">单元格左右统一内边距(px)</label><input id="cellPadX" type="number" min="4" max="40" value="12"></div>
    <div><label for="width">图片宽度（px）</label><input id="width" type="number" min="400" max="2400" value="1080"></div>
    <div><label for="stripe">隔行底色</label><input id="stripe" type="color" value="#f3f3f3"></div>

    <div><label for="noteSize">备注字号（px）</label><input id="noteSize" type="number" min="8" max="24" value="18"></div>
    <div><label for="noteColor">备注文字颜色</label><input id="noteColor" type="color" value="#555555"></div>

    <div><label for="unitText">单位文字（和最后一列右对齐）</label><input id="unitText" value="单位：cm"></div>
    <div><label for="unitSize">单位字号（px）</label><input id="unitSize" type="number" min="8" max="24" value="18"></div>
    <div><label for="unitColor">单位文字颜色</label><input id="unitColor" type="color" value="#555555"></div>
    <div><label for="unitRightPad">单位右侧边距(px)</label><input id="unitRightPad" type="number" min="0" max="60" value="22"></div>
  </div>
  <label class="checkline"><input id="transpose" type="checkbox" checked> 自动转置（原始表格：尺码在列，生成后尺码在行）</label>
  <label class="checkline"><input id="firstBold" type="checkbox" checked> 首列尺码加粗</label>
  <label for="noteText">表格底部备注内容（左侧，和表格首列对齐）</label><input id="noteText" value="注：因手工测量，可能存在1‑3cm的误差，请悉知谅解">
  <div class="actions">
    <button id="export">导出高清 PNG</button>
    <button class="secondary" id="copy">复制表格数据</button>
  </div>
</section>
<section class="panel">
  <div class="preview-head"><h2>03 / 实时设计预览</h2><span style="font-size:11px;color:#999">电商简约灰白风格</span></div>
  <div class="stage"><div id="preview"><div class="empty">粘贴尺码表数据后，点击「生成尺码表」查看效果</div></div></div>
  <div class="hint">预览区域为最终图片的版式参考。导出 PNG 时会按设置的图片宽度生成高清图片。</div>
</section>
</main>
<script>
let outputRows=[];
const $=id=>document.getElementById(id);
function parseTSV(text){
  return text.replace(/\r/g,'').split('\n').map(line=>line.split('\t')).filter(row=>row.some(v=>v.trim()!==''));
}
function cleanGrid(grid){
  if(!grid.length)return [];
  const max=Math.max(...grid.map(r=>r.length));
  let rows=grid.map(r=>Array.from({length:max},(_,i)=>(r[i]??'').trim()));
  const keepCols=[];
  for(let c=0;c<max;c++) if(rows.some(r=>r[c]!=='')) keepCols.push(c);
  rows=rows.map(r=>keepCols.map(c=>r[c]));
  while(rows.length && rows[0].every(v=>!v)) rows.shift();
  while(rows.length && rows[rows.length-1].every(v=>!v)) rows.pop();
  return rows;
}
function buildData(){
  const raw=parseTSV($('source').value);
  const grid=cleanGrid(raw);
  if(grid.length<2 || grid[0].length<2){$('status').textContent='数据不足：请至少粘贴一行表头和一行尺码数据。';return;}
  let rows;
  if($('transpose').checked){
    const headers=grid[0];
    const measurementNames=grid.slice(1).map(r=>r[0]||'').filter(v=>v!=='');
    const trans=[['尺码',...measurementNames]];
    const sizePattern=/^(XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|XXXXL|[0-9]{1,3}(?:-[0-9]{1,3})?|均码|F|FREE)$/i;
    let sizeCols=[];
    for(let c=1;c<headers.length;c++){
      const label=(headers[c]||'').trim();
      if(!label || /测量方法|说明|备注|单位/i.test(label)) continue;
      if(sizePattern.test(label) || grid.slice(1).some(r=>(r[c]||'').trim()!=='' && /^[-+]?\d+(?:\.\d+)?$/.test((r[c]||'').trim()))){
        sizeCols.push(c);
      }
    }
    if(!sizeCols.length){
      for(let c=1;c<headers.length;c++){
        const label=(headers[c]||'').trim();
        if(label && !/测量方法|说明|备注|单位/i.test(label) && grid.slice(1).some(r=>(r[c]||'').trim()!=='')) sizeCols.push(c);
      }
    }
    sizeCols.forEach(c=>{
      const size=(headers[c]||'').trim();
      trans.push([size,...grid.slice(1).filter(r=>(r[0]||'').trim()!=='').map(r=>r[c]||'')]);
    });
    outputRows=trans;
  }else{
    outputRows=grid;
  }
  render();
  $('status').textContent=`已识别 ${outputRows.length-1} 个尺码行，${Math.max(0,outputRows[0].length-1)} 个测量项目。`;
}
function render(){
  const root=$('preview');
  if(!outputRows.length){root.innerHTML='<div class="empty">暂无数据</div>';return;}
  const font=$('font').value;
  const fontWeight=$('fontWeight').value;
  const fs=Math.max(9,Math.min(30,+$('size').value||16));
  const pad=Math.max(20,Math.min(100,+$('padding').value||70));
  const cellPadX=Math.max(4,Math.min(40,+$('cellPadX').value||12));
  const unitRightPad=Math.max(0,Math.min(60,+$('unitRightPad').value||22));
  const stripe=$('stripe').value;

  const noteSize=Math.max(8,Math.min(24,+$('noteSize').value||15));
  const noteColor=$('noteColor').value;
  const noteText=$('noteText').value.trim();

  const unitText=$('unitText').value.trim();
  const unitSize=Math.max(8,Math.min(24,+$('unitSize').value||15));
  const unitColor=$('unitColor').value;

  let html='';
  const title=$('title').value.trim();
  if(title) html+=`<div style="text-align:center;font-size:${fs+5}px;font-weight:600;letter-spacing:2px;margin:0 0 18px;font-family:${font}">${esc(title)}</div>`;

  html+='<table style="font-family:'+font+';font-weight:'+fontWeight+';table-layout:fixed">';
  html+='<colgroup>';
  outputRows[0].forEach(()=>html+=`<col>`);
  html+='</colgroup>';
  html+='<thead><tr>';
  outputRows[0].forEach((v)=>html+=`<th style="font-size:${fs}px;height:${pad}px;padding:0 ${cellPadX}px">${esc(v)}</th>`);
  html+='</tr></thead><tbody>';
  outputRows.slice(1).forEach((r,i)=>{
    html+=`<tr style="background:${i%2===0?stripe:'#ffffff'};height:${pad}px">`;
    r.forEach((v,j)=>html+=`<td style="font-size:${fs}px;height:${pad}px;padding:0 ${cellPadX}px;${j===0&&$('firstBold').checked?'font-weight:600':''}">${esc(v)}</td>`);
    html+='</tr>';
  });
  html+='</tbody></table>';

  html += `<table style="width:100%;border-collapse:collapse;margin-top:10px;font-family:${font};background:transparent;table-layout:fixed">
  <colgroup>
    <col>
    <col span="${outputRows[0].length-1}">
  </colgroup>
  <tr style="background:transparent;">
    <td style="text-align:left;font-size:${noteSize}px;color:${noteColor};padding:0;background:transparent;">${esc(noteText)}</td>
    <td colspan="${outputRows[0].length-1}" style="text-align:right;font-size:${unitSize}px;color:${unitColor};padding:0 ${unitRightPad}px 0 0;background:transparent;">${esc(unitText)}</td>
  </tr>
  </table>`;

  root.innerHTML=html;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function drawPNG(){
  if(!outputRows.length){$('status').textContent='请先生成尺码表。';return;}
  const scale=2;
  const width=Math.max(400,Math.min(2400,+$('width').value||1080));
  const cols=outputRows[0].length, rows=outputRows.length;

  const pad=Math.max(20,Math.min(100,+$('padding').value||70));
  const cellPadX=Math.max(4,Math.min(40,+$('cellPadX').value||12));
  const unitRightPad=Math.max(0,Math.min(60,+$('unitRightPad').value||22));
  const fs=Math.max(9,Math.min(30,+$('size').value||16));
  const fontWeight=$('fontWeight').value;
  const font=$('font').value;
  const stripe=$('stripe').value;

  const noteText=$('noteText').value.trim();
  const noteSize=Math.max(8,Math.min(24,+$('noteSize').value||15));
  const noteColor=$('noteColor').value;

  const unitText=$('unitText').value.trim();
  const unitSize=Math.max(8,Math.min(24,+$('unitSize').value||15));
  const unitColor=$('unitColor').value;

  const title=$('title').value.trim();

  const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');

  const margin=24;
  const titleH=title?fs+34:12;
  const rowH=pad;
  const footerGap=12;

  canvas.width=width*scale;
  canvas.height= (margin*2 + titleH + rows*rowH + footerGap + Math.max(noteSize,unitSize)+10)*scale;
  ctx.scale(scale,scale);
  ctx.clearRect(0,0,width,canvas.height/scale);

  const usable=width-margin*2;

  const weights=Array(cols).fill(0);
  outputRows.forEach((r,ri)=>r.forEach((v,c)=>{
    ctx.font=`${ri===0?'600':fontWeight} ${fs}px ${font}`;
    weights[c]=Math.max(weights[c],ctx.measureText(String(v)).width + cellPadX*2);
  }));
  let total=weights.reduce((a,b)=>a+b,0);
  const colW=weights.map(w=>w/total*usable);

  let y=margin;
  if(title){
    ctx.font=`600 ${fs+5}px ${font}`;
    ctx.fillStyle='#222';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(title,width/2,y+titleH/2,usable);
    y+=titleH;
  }

  outputRows.forEach((r,ri)=>{
    if(ri>0 && (ri-1)%2===0){
      ctx.fillStyle=stripe;
      ctx.fillRect(margin,y,usable,rowH);
    }
    let x=margin;
    r.forEach((v,c)=>{
      const isHead=ri===0;
      const isFirstColBold=(c===0 && $('firstBold').checked);
      const fw = isHead || isFirstColBold ? '600' : fontWeight;
      ctx.font=`${fw} ${fs}px ${font}`;
      ctx.fillStyle='#222';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(String(v),x+colW[c]/2,y+rowH/2,Math.max(10,colW[c]-cellPadX*2));
      x+=colW[c];
    });
    y+=rowH;
  });
  y += footerGap;

  ctx.font=`${noteSize}px ${font}`;
  ctx.fillStyle=noteColor;
  ctx.textAlign='left';
  ctx.textBaseline='top';
  ctx.fillText(noteText, margin, y);

  const tableRightX = margin + usable - unitRightPad;
  ctx.font=`${unitSize}px ${font}`;
  ctx.fillStyle=unitColor;
  ctx.textAlign='right';
  ctx.textBaseline='top';
  ctx.fillText(unitText, tableRightX, y);

  const a=document.createElement('a');
  a.download='服装尺码表.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
  $('status').textContent='PNG 已生成并开始下载。';
}

$('generate').onclick=buildData;
$('source').addEventListener('paste',()=>setTimeout(buildData,80));
$('example').onclick=()=>{
 $('source').value='尺码部位\t测量方法\tS\tM\tL\tXL\n后中长\t\t68\t69.5\t71\t72.5\n肩宽\t\t41.8\t43\t44.2\t45.4\n1/2胸围\t\t48\t50\t52\t54\n1/2下摆\t\t48\t50\t52\t54\n袖长\t\t62.5\t63.5\t64.5\t65.5\n1/2袖肥\t\t17.2\t18\t18.8\t19.6\n1/2袖口\t\t10.7\t11.2\t11.7\t12.2\n1/2领围\t\t23\t23.5\t24\t24.5\n袖笼弧长\t\t51.9\t53.6\t55.3\t57';
 buildData();
};
$('clear').onclick=()=>{$('source').value='';outputRows=[];render();$('status').textContent='已清空。';};
['title','font','fontWeight','size','padding','cellPadX','unitRightPad','stripe','firstBold','noteSize','noteColor','noteText','unitText','unitSize','unitColor'].forEach(id=>$(id).addEventListener('input',render));
$('transpose').addEventListener('change',()=>{if($('source').value.trim())buildData();});
$('export').onclick=drawPNG;
$('copy').onclick=async()=>{
 if(!outputRows.length){$('status').textContent='请先生成尺码表。';return;}
 const tsv=outputRows.map(r=>r.join('\t')).join('\n');
 try{await navigator.clipboard.writeText(tsv);$('status').textContent='表格数据已复制。';}
 catch(e){$('status').textContent='浏览器未允许自动复制，请手动选中数据或使用导出 PNG。';}
};
</script>
</body>
</html>
